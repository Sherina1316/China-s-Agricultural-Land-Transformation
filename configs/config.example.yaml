project:
  name: China agricultural land-use transformation
  start_year: 2000
  end_year: 2023
  stable_threshold_percent: 5.0

paths:
  output_dir: outputs
  # Option A: use a prepared province-by-year cropland table.
  prepared_cropland_table: data/raw/cropland_extent_by_province_prepared.csv
  cropland_extent_processed: data/processed/cropland_extent_by_province.csv
  # Option B: extract from annual CACD rasters instead of prepared table.
  raw_cacd_rasters: data/raw/CACD_rasters
  province_boundaries: data/raw/boundaries/china_provinces.shp
  crop_sown_area: data/raw/crop_sown_area_by_province.csv
  pca_indicator_table: data/processed/pca_indicators.csv
  gtwr_model_table: data/processed/gtwr_model_table.csv

parameters:
  cropland_values: "1"

variables:
  explanatory_variables: [SSN, GM, IPLG, RW]
  response_variables: [CWE, CS, HQ, NDR, SDR, RHI, CP]
  coordinate_columns:
    longitude: longitude
    latitude: latitude
  time_column: year
